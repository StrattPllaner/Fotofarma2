<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FotoFarma">
  <defs>
    <linearGradient id="ffLila" x1="178" y1="112" x2="334" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8b0f4"/>
      <stop offset="0.5" stop-color="#c092e8"/>
      <stop offset="0.85" stop-color="#a475d2"/>
      <stop offset="1" stop-color="#9564c2"/>
