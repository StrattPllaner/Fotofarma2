    <script>
      // Si el teléfono guardó una versión vieja de esta página y sus archivos ya no existen,
      // recargar una vez sin caché en vez de quedarse en blanco.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || !(t.tagName === 'SCRIPT' || t.tagName === 'LINK')) return;
        try {
          if (sessionStorage.getItem('ff-recarga')) return;
          sessionStorage.setItem('ff-recarga', '1');
        } catch (_) { return; }
        location.replace(location.pathname + '?v=' + Date.now());
      }, true);
    </script>
