name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Se activa cuando envías cambios a la rama main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        run: |
          npm install
          npm run build
        env:
          # URL pública de tu Cloudflare Worker (proxy/worker.js). Sirve las rutas /api/* (IA)
          # y /similares|/benavides (precios). Configúrala en:
          #   Settings > Secrets and variables > Actions > Variables > New repository variable
          #   Nombre: VITE_PROXY_URL   Valor: https://fotofarma-proxy.<tu-subdominio>.workers.dev
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
          # (opcional) Si algún día alojas el backend en otro sitio, define VITE_API_URL aparte.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Sube la carpeta dist que generamos arriba
          branch: gh-pages # La sube a esta rama especial
