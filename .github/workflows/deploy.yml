name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Se activa cuando envías cambios a la rama main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        run: |
          npm install
          npm run build
        env:
          # Llave de Gemini para el análisis de recetas con IA (se llama directo desde el navegador).
          # Se inyecta al bundle con el prefijo VITE_. Configúrala en:
          #   Settings > Secrets and variables > Actions > Secrets > New repository secret
          #   Nombre: VITE_GEMINI_API_KEY   Valor: tu llave de https://aistudio.google.com/app/apikey
          # Usa una llave SIN facturación (solo capa gratuita), ya que queda embebida en el sitio público.
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Sube la carpeta dist que generamos arriba
          branch: gh-pages # La sube a esta rama especial
